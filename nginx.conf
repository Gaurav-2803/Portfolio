# HTTP
server {
    listen 80;
    listen [::]:80;

    server_name bygaurav.com www.bygaurav.com;

    return 301 https://bygaurav.com$request_uri;
}


# HTTPS - canonical domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name bygaurav.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}


# HTTPS - redirect www to canonical domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.bygaurav.com;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    return 301 https://bygaurav.com$request_uri;
}