<footer class="footer">
  <div class="footer__container">
    <div class="footer__divider"></div>

    <div class="footer__content">
      <!-- Logo -->
      <a class="footer__logo" href="#hero" (click)="scrollTo('hero', $event)">
        <span class="logo-bracket">&lt;</span>
        <span class="logo-name">GA</span>
        <span class="logo-bracket">/&gt;</span>
      </a>

      <!-- Nav -->
      <nav class="footer__nav">
        <a
          *ngFor="let item of navItems"
          class="footer__nav-link"
          [href]="'#' + item.toLowerCase()"
          (click)="scrollTo(item.toLowerCase(), $event)"
          [id]="'footer-nav-' + item.toLowerCase()"
        >
          {{ item }}
        </a>
      </nav>

      <!-- Right: Copyright -->
      <p class="footer__copy">
        Designed & Built by
        <a href="https://github.com/Gaurav-2803" target="_blank" rel="noopener noreferrer" id="footer-github-link">
          Gaurav Agrawal
        </a>
        &copy; {{ year }}
      </p>
    </div>

    <p class="footer__made-with">
      Built with <span class="heart">♥</span> using Angular + Angular Material
    </p>
  </div>
</footer>
