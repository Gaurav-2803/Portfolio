<section class="section projects" id="projects">
  <div class="section__container">
    <div class="section__header">
      <span class="section-label">// what i've built</span>
      <h2>Featured <span>Projects</span></h2>
    </div>

    <div class="projects__grid">
      <div
        *ngFor="let project of projects; let i = index"
        class="project-card glass-card"
        [class.project-card--featured]="project.featured"
        [style.--proj-accent]="project.accent"
        [id]="'project-' + i"
      >
        <!-- Accent border top -->
        <div class="project-card__accent-bar"></div>

        <div class="project-card__inner">
          <!-- Header -->
          <div class="project-card__header">
            <div class="project-card__emoji">{{ project.emoji }}</div>
            <div class="project-card__actions">
              <a
                *ngIf="project.github"
                [href]="project.github"
                target="_blank"
                rel="noopener noreferrer"
                class="project-card__action-btn"
                [id]="'project-github-' + i"
                matTooltip="View on GitHub"
              >
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                  <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.164 6.839 9.489.5.09.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.577.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"/>
                </svg>
              </a>
              <a
                *ngIf="project.demo"
                [href]="project.demo"
                target="_blank"
                rel="noopener noreferrer"
                class="project-card__action-btn"
                [id]="'project-demo-' + i"
              >
                <mat-icon style="font-size:18px;height:18px;width:18px">open_in_new</mat-icon>
              </a>
            </div>
          </div>

          <!-- Title -->
          <div class="project-card__title-group">
            <h3 class="project-card__title">{{ project.title }}</h3>
            <p class="project-card__subtitle">{{ project.subtitle }}</p>
            <span class="project-card__period">{{ project.period }}</span>
          </div>

          <!-- Description -->
          <p class="project-card__description">{{ project.description }}</p>

          <!-- Highlights -->
          <ul class="project-card__highlights">
            <li *ngFor="let h of project.highlights">
              <span class="bullet">▸</span> {{ h }}
            </li>
          </ul>

          <!-- Tags -->
          <div class="project-card__tags">
            <span *ngFor="let tag of project.tags" class="project-card__tag">
              {{ tag }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- GitHub CTA -->
    <div class="projects__cta">
      <p>Want to see more of my work?</p>
      <a
        href="https://github.com/Gaurav-2803"
        target="_blank"
        rel="noopener noreferrer"
        class="projects__github-btn"
        id="projects-github-cta"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.164 6.839 9.489.5.09.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.577.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        View All on GitHub
      </a>
    </div>
  </div>
</section>
